# The MSG SEVIRI low resolution channels, and how each one is normalised.
#
# This file decides both which channels a model is trained on and what order they arrive in - the
# samples are built in the order the channels are written here, whatever order the zarr store holds
# them in. Reordering or removing an entry therefore changes what an existing model sees at each
# index, so make a new file rather than editing this one if models already depend on it.
#
# Each channel is clipped to [clip_min, clip_max] and then turned into a z-score using `mean` and
# `std`, which are of the channel after clipping and share its units. The visible and near infrared
# channels are bidirectional reflectances in percent, the rest are brightness temperatures in
# Kelvin. An optional `units` per channel is used to label the validation videos.
#
# `missing_value` is what the model is shown where the satellite recorded nothing. It is in the
# same physical units and is z-scored but not clipped, so it can sit outside [clip_min, clip_max].
# These are one standard deviation below clip_min, far enough out that the model can tell a gap
# from a real reading. Filling with `mean` instead is a reasonable alternative.
#
# These are the constants used by PVNet - see the `normalisation_constants` block of
# https://github.com/openclimatefix/PVNet/blob/main/configs/datamodule/configuration/all_bells0.yaml
#
# To train on a different set of channels, copy this file alongside it and select it with:
#     python src/sat_pred/train.py datamodule/channels=my_channels

VIS006:
