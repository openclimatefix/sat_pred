# --- PROJECT CONFIGURATION --- #

[build-system]
requires = ["setuptools>=67", "wheel", "setuptools-git-versioning>=2.0,<3"]
build-backend = "setuptools.build_meta"

# Metadata (see https://peps.python.org/pep-0621/)
[project]
name = "sat-pred"
description = "Training deterministic models to predict future satellite imagery"
dynamic = ["version"] # Set automatically using git: https://setuptools-git-versioning.readthedocs.io/en/stable/
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Open Climate Fix team", email = "info@openclimatefix.org" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch",
    "lightning",
    "numpy",
    "pandas",
    "xarray",
    "zarr>=3",
    "hydra-core",
    "omegaconf",
    "pydantic",
    "ocf-data-sampler",
    "matplotlib",
    "scikit-image",
    "pyyaml",
    "rich",
    "tensorstore",
    "tqdm",
    "typer",
    "wandb[media]",
    "safetensors",
    "huggingface_hub",
    "xarray-tensorstore",
]

[dependency-groups]
dev = [
    # Testing
    "pytest",
    "ruff >= 0.9.2",
    "ty",
    # LSP Support
    "python-lsp-server",
    "python-lsp-ruff",
]

[project.urls]
repository = "https://github.com/openclimatefix/sat_pred"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-git-versioning]
enabled = true


# --- LINTING AND TYPING CONFIGURATION --- #

# ty configuration
# * See https://docs.astral.sh/ty/reference/configuration/
[tool.ty.src]
include = ["src"]
exclude = ["tests/**", "scripts/**"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

# `cloudcasting` and `earthformer` are installed from git, not PyPI - see the README
[tool.ty.analysis]
allowed-unresolved-imports = ["cloudcasting.**", "earthformer.**"]

# Ratchet: modules not yet conformant. Delete entries as they're fixed.
[[tool.ty.overrides]]
include = ["src/sat_pred/**"]

[tool.ty.overrides.rules]
all = "ignore"


# Ruff configuration
# * See https://beta.ruff.rs/docs/
[tool.ruff]
line-length = 100
indent-width = 4
force-exclude = true
extend-exclude = ["scratch.ipynb"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "W",   # whitespace and newlines
    "I",   # isort
    "UP",  # modernize
    "ANN", # flake8 type annotations
    "S",   # flake8 bandit
    "B",   # flake8 bugbear
    "C4",  # flake8 comprehensions
    "COM", # flake8 commas
    "T20", # flake8 print
    "SIM", # flake8 simplify
    "ARG", # flake8 unused arguments
    "DTZ", # flake8 datetimes
    "Q",   # flake8 quotes
    "TC",  # flake8 typecheck
    "D",   # pydocstyle
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]
ignore = [
    "D203", "D213", "D215", "D400", "D401", "D404", "D406",
    "D407", "D408", "D409", "D413", "COM812",
]

[tool.ruff.lint.per-file-ignores]
# S301: tests unpickle only blobs they created themselves
"tests/**" = ["D", "ANN", "S101", "S301"]
"__init__.py" = ["F401", "D104"]
# Ratchet: rules the existing code does not yet satisfy. Delete entries as they're fixed.
# * Many of these are autofixable with `ruff check --fix`
"src/sat_pred/**" = [
    "ANN", "ARG", "B006", "B007", "B008", "B018", "C416", "COM819", "D1", "D2",
    "D415", "D417", "E501", "F401", "I001", "Q000", "RUF002", "RUF003", "RUF005",
    "RUF013", "RUF059", "S101", "SIM", "T20", "TC002", "UP008", "W291", "W292", "W293",
]
"scripts/**" = [
    "ANN", "ARG", "C416", "D1", "D2", "D415", "D417", "E501", "F401", "I001",
    "Q000", "RUF013", "S101", "T20", "W291", "W292", "W293",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100


# --- TESTING CONFIGURATION --- #

[tool.pytest.ini_options]
testpaths = ["tests"]
